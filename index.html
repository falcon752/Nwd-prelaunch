      // Remove preloader after page loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          const preloader = document.getElementById('js-preloader');
          if (preloader) {
            preloader.style.opacity = '0';
            setTimeout(function() {
              preloader.style.display = 'none';
            }, 500);

        }, 1000);
      });
